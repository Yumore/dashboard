plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('config.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def hasReleaseSigning = ['keyAlias', 'keyPassword', 'storeFile', 'storePassword']
    .every { signingProperties.getProperty("config.$it") }

android {
    namespace 'com.nsapp.dashboard'
    compileSdk flutter.compileSdkVersion
    ndkVersion providers.gradleProperty('dashboardNdkVersion').getOrElse(flutter.ndkVersion)

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.nsapp.dashboard'
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                enableV3Signing true
                enableV4Signing true
                keyAlias signingProperties.getProperty('config.keyAlias')
                keyPassword signingProperties.getProperty('config.keyPassword')
                storeFile file(signingProperties.getProperty('config.storeFile'))
                storePassword signingProperties.getProperty('config.storePassword')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

tasks.configureEach { task ->
    if (task.name in ['preReleaseBuild', 'validateSigningRelease']) {
        task.doFirst {
            if (!hasReleaseSigning) {
                throw new GradleException('Release signing requires android/config.properties.')
            }
        }
    }
}
